/zt_traversability_node:
  ros__parameters:
    # ele_scouts_kit filtered local elevation GridMap.
    input_topic: /elevation_mapping_node/elevation_map_filter
    input_layer: inpaint

    output_topic: /zt_traversability/traversability_8dir

    # Empty means: use share/zt_traversability_ros2/models/student_8dir.pth.
    model_path: ""
    device: cuda
    allow_cpu_fallback: false

    # The supplied legacy student was trained at approximately 4 cm/cell.
    expected_resolution: 0.04
    resolution_tolerance: 0.001

    # Start conservatively. Increase only after measuring AGX latency.
    inference_fps: 5.0

    # A 45x45 output window must contain at least this fraction of originally
    # observed/inpainted finite cells. Remaining outputs are published unknown.
    min_valid_ratio: 0.70

    # Published zt_dir_i uses raw model channel direction_channel_order[i].
    # Keep identity until a one-way-ramp test determines the physical mapping.
    direction_channel_order: [0, 1, 2, 3, 4, 5, 6, 7]
