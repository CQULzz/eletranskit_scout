common:
  # 1: receive packets from an online LiDAR.
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  - driver:
      lidar_type: RSHELIOS
      msop_port: 3344
      difop_port: 5566
      imu_port: 0
      user_layer_bytes: 0
      tail_layer_bytes: 0

      min_distance: 0.2
      max_distance: 200.0
      use_lidar_clock: false
      dense_points: false
      ts_first_point: true
      start_angle: 0.0
      end_angle: 360.0

      # RSHELIOS emits about 1800 blocks per revolution at 10 rps. Split each
      # revolution into two fresh half-scan clouds so the mapper has enough
      # input headroom for a stable 10 Hz output instead of being capped by
      # the observed 8-9 Hz full-revolution publication rate.
      split_frame_mode: 3
      num_blks_split: 900

      # Only used when msg_source is 3.
      pcap_repeat: true
      pcap_rate: 1.0
      pcap_path: ./lidar.pcap

    ros:
      ros_frame_id: rslidar
      ros_recv_packet_topic: /rslidar_packets
      ros_send_packet_topic: /rslidar_packets
      ros_send_imu_data_topic: /rslidar_imu_data
      ros_send_point_cloud_topic: /rslidar_points
      # Keep latency bounded if a downstream consumer briefly falls behind.
      ros_queue_length: 5
