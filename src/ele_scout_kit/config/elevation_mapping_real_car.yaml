/elevation_mapping_node:
  ros__parameters:
    map_frame: odom
    corrected_map_frame: odom
    base_frame: FP_POI
    initialize_frame_id: [FP_POI]

    # Explicitly enable common-mode Z-drift compensation. Motion gating is
    # driven by consecutive map<-LiDAR TF poses in the ROS2 point-cloud path.
    enable_drift_compensation: true
    min_height_drift_cnt: 100
    max_drift: 0.10
    drift_compensation_alpha: 0.10
    position_noise_thresh: 0.01
    orientation_noise_thresh: 0.01
    position_lowpass_alpha: 0.20
    orientation_lowpass_alpha: 0.20

    # The live RoboSense publisher offers RELIABLE. Match it and keep only a
    # very short queue so a transient scheduling delay does not silently lose
    # a complete 360-degree scan or accumulate stale scans.
    pointcloud_qos_reliability: reliable
    pointcloud_qos_depth: 2

    # Remove the measured vehicle-body return in the LiDAR frame while keeping
    # points above and below the vehicle volume.
    self_filter_enabled: true
    self_filter_min_x: -1.0
    self_filter_max_x: 0.2
    self_filter_min_y: -0.7
    self_filter_max_y: 0.7
    self_filter_min_z: -0.9
    self_filter_max_z: 0.2

    # Every fused cloud updates a logically unbounded sparse tile map. The
    # finite GridMap topic is only a detailed view; tiles remain on disk.
    enable_global_map: true
    global_map_storage_path: '~/.ros/elevation_mapping_cupy/global_tiles.sqlite3'
    global_map_resume_from_disk: false
    global_map_view_length_x: 30.0
    global_map_view_length_y: 30.0
    global_map_view_follow_robot: false

    # Keep GPU mapping on the point-cloud callback's critical path, but move
    # GPU-to-CPU download and sparse tile fusion to a lossless buffered worker.
    global_map_async_fusion: true
    global_map_snapshot_buffer_count: 3

    # Persistent-global cells are fused only when the current LiDAR frame
    # actually updated the rolling posterior.  Keep a 5 cm standard-deviation
    # floor to avoid false certainty from correlated rolling-map posteriors;
    # reject a conflicting rewrite beyond the stricter of 3 sigma and 30 cm.
    global_map_fusion_variance_floor: 0.0025
    global_map_fusion_variance_ceiling: 4.0
    global_map_outlier_sigma: 3.0
    global_map_max_height_jump: 0.30

    # HT computes the actual eight-direction traversability. Avoid running the
    # mapper's separate legacy traversability network on every LiDAR frame.
    enable_builtin_traversability: false

    # A second 10 m robot-following view is cropped from the accumulated
    # persistent global map and fed to the eight-direction inference node.
    enable_global_map_local_view: true
    global_map_local_topic: /elevation_mapping_node/elevation_map_global_local
    global_map_local_length_x: 10.0
    global_map_local_length_y: 10.0
    global_map_local_publish_fps: 20.0

    subscribers:
      lidar:
        topic_name: /rslidar_points
        data_type: pointcloud

    publishers:
      elevation_map_raw:
        layers: [elevation, variance]
        basic_layers: [elevation]
        fps: 10.0

      elevation_map_filter:
        layers: [min_filter, smooth, near_base_filtered, despiked, inpaint, elevation]
        basic_layers: [min_filter, smooth, near_base_filtered, despiked, inpaint]
        fps: 10.0
