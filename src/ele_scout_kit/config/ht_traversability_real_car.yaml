/ht_traversability_node:
  ros__parameters:
    # Robot-following 10 m crop extracted from the persistent global map.
    input_topic: /elevation_mapping_node/elevation_map_global_local
    input_layer: elevation
    output_topic: /ht_traversability/global_local

    # Publish a conservative aggregate: all eight directional probabilities
    # must pass the threshold. One failed direction makes the cell red (0).
    aggregate_only: true
    # Calibrated on the 2026-08-31 live sample. Keep this configurable because
    # the final operational threshold still requires labelled terrain data.
    traversability_threshold: 0.15

    # An empty path resolves to the checkpoint installed by this package.
    model_path: ""
    device: cuda
    allow_cpu_fallback: false
    expected_resolution: 0.04
    resolution_tolerance: 0.001
    # Process every new local-map revision. A wall-clock rate limiter can drop
    # one of two jittered 10 Hz inputs that happen to arrive <50 ms apart even
    # though their long-term rate is only 10 Hz.
    inference_fps: 0.0
    warmup_rows: 250
    warmup_cols: 250
    warmup_iterations: 2
    min_valid_ratio: 0.30
    direction_channel_order: [0, 1, 2, 3, 4, 5, 6, 7]
